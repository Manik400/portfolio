<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Manik Goyal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml">
<style>
  :root{--paper:#E9EAE4;--ink:#11151A;--card:#fff;--red:#EE3D28;color-scheme:light}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--paper:#0D1114;--ink:#ECEEE9;--card:#151A1F;--red:#FF5F49;color-scheme:dark}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--paper);color:var(--ink);
       font:14px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  .card{border:2px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--ink);
        padding:28px 24px;max-width:460px;width:100%}
  h1{font-size:64px;line-height:1;margin:0 0 8px;letter-spacing:-.03em}
  p{color:inherit;opacity:.75;margin:0 0 20px}
  a{display:inline-block;border:2px solid var(--ink);background:var(--red);color:#fff;
    padding:8px 14px;font-weight:700;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>DROPPED MESSAGE · NO ROUTE FOR THIS PATH</p>
    <a href="/portfolio/">← back to the pipeline</a>
  </div>
</body>
</html>
